
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recuperar contraseña</title>
</head>
<body>
    <h2>Farmacia Mundo Magistral</h2>
    <h3>Restablecer contraseña</h3>

    <input
        type="password"
        id="password"
        placeholder="Nueva contraseña"
        minlength="12"
    >

    <button id="guardar" disabled>
        Guardar contraseña
    </button>

    <p id="mensaje">Verificando enlace...</p>

    <script>
        const mensaje = document.getElementById("mensaje");
        const boton = document.getElementById("guardar");

        const fragmento = new URLSearchParams(
            window.location.hash.substring(1)
        );

        const token = fragmento.get("access_token");
        const tipo = fragmento.get("type");

        // Retirar los tokens de la dirección visible.
        history.replaceState(null, "", window.location.pathname);

        if (token && tipo === "recovery") {
            mensaje.textContent = "Introduce tu nueva contraseña.";
            boton.disabled = false;
        } else {
            mensaje.textContent =
                "Enlace inválido o vencido. Solicita uno nuevo.";
        }

        boton.onclick = async function () {
            const password = document.getElementById("password").value;

            if (password.length < 12) {
                mensaje.textContent =
                    "Utiliza al menos 12 caracteres.";
                return;
            }

            boton.disabled = true;

            try {
                const respuesta = await fetch(
                    "/auth/recuperar-password",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "Authorization": "Bearer " + token
                        },
                        body: JSON.stringify({ password })
                    }
                );

                const datos = await respuesta.json();

                if (!respuesta.ok) {
                    throw new Error(
                        datos.detail || "No se pudo actualizar"
                    );
                }

                mensaje.textContent =
                    "Contraseña actualizada correctamente.";
            } catch (error) {
                mensaje.textContent = error.message;
                boton.disabled = false;
            }
        };
    </script>
</body>
</html>
